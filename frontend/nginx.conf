server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # API запросы проксируются в gateway (так не нужен CORS)
    location ~ ^/(users|accounts|transactions)(/|$) {
        proxy_pass http://ms-api-gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
