jwt:
  secret: my-super-secret-jwt-key-for-banking-system-2026

spring:
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: http://localhost:8081
          predicates:
            - Path=/users/**

        - id: account-service
          uri: http://localhost:8082
          predicates:
            - Path=/accounts/**

        - id: transaction-service
          uri: http://localhost:8083
          predicates:
            - Path=/transactions/**