server:
  port: 8080

spring:
  application:
    name: ms-api-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: user-service
              uri: ${USER_SERVICE_URL}
              predicates:
                - Path=/users/**

            - id: account-service
              uri: ${ACCOUNT_SERVICE_URL}
              predicates:
                - Path=/accounts/**

            - id: transaction-service
              uri: ${TRANSACTION_SERVICE_URL}
              predicates:
                - Path=/transactions/**

jwt:
  secret: ${JWT_SECRET}