server:
  port: 8080

spring:
  application:
    name: ms-api-gateway

  cloud:
    gateway:
      routes:
        - id: user-service
          uri: http://localhost:8081
          predicates:
            - Path=/users/**

        - id: account-service
          uri: http://localhost:8082
          predicates:
            - Path=/accounts/**

        - id: transaction-service
          uri: http://localhost:8083
          predicates:
            - Path=/transactions/**

jwt:
  secret: ${JWT_SECRET}