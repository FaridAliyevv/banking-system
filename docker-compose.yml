services:

  mysql:
    image: mysql:8.0
    container_name: banking-mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_USER: springstudent
      MYSQL_PASSWORD: springstudent
      MYSQL_ROOT_PASSWORD: springstudent
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pspringstudent"]
      interval: 5s
      timeout: 5s
      retries: 20

  ms-user:
    build: ./ms-user
    image: ms-user:latest
    container_name: ms-user
    ports:
      - "8081:8081"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/user_db
      DB_USERNAME: springstudent
      DB_PASSWORD: springstudent
      JWT_SECRET: ${JWT_SECRET}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      mysql:
        condition: service_healthy

  ms-account:
    build: ./ms-account
    image: ms-account:latest
    container_name: ms-account
    ports:
      - "8082:8082"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/account_db
      DB_USERNAME: springstudent
      DB_PASSWORD: springstudent
      USER_SERVICE_URL: http://ms-user:8081
      JWT_SECRET: ${JWT_SECRET}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      mysql:
        condition: service_healthy
      ms-user:
        condition: service_started

  ms-transaction:
    build: ./ms-transaction
    image: ms-transaction:latest
    container_name: ms-transaction
    ports:
      - "8083:8083"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/transaction_db
      DB_USERNAME: springstudent
      DB_PASSWORD: springstudent
      ACCOUNT_SERVICE_URL: http://ms-account:8082
      JWT_SECRET: ${JWT_SECRET}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      mysql:
        condition: service_healthy
      ms-account:
        condition: service_started

  ms-api-gateway:
    build: ./ms-api-gateway
    image: ms-api-gateway:latest
    container_name: ms-api-gateway
    ports:
      - "8080:8080"
    environment:
      JWT_SECRET: ${JWT_SECRET}
      USER_SERVICE_URL: http://ms-user:8081
      ACCOUNT_SERVICE_URL: http://ms-account:8082
      TRANSACTION_SERVICE_URL: http://ms-transaction:8083
    depends_on:
      - ms-user
      - ms-account
      - ms-transaction

volumes:
  mysql_data: